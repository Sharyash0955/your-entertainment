name: CI & Concurrency Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  concurrency-test:
    name: Run Concurrency Load Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run TypeScript Linter
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Start server in background
        run: |
          npm run dev &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

      - name: Wait for server readiness
        run: |
          echo "Awaiting server readiness on port 3000..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/health | grep -q "ok"; then
              echo "Server is online and responding healthy!"
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for server to start"
          exit 1

      - name: Execute 50-Worker Concurrency Load Test
        run: npm run test:concurrency

      - name: Teardown background server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            echo "Shutting down server (PID: $SERVER_PID)..."
            kill $SERVER_PID 2>/dev/null || true
          fi
